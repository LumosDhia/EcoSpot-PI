security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: 
                - App\Security\LoginFormAuthenticator
                - App\Security\FaceAuthenticator
            logout:
                path: app_logout
                target: home

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/ngo, roles: ROLE_NGO }
        - { path: ^/blog/editor-upload, roles: [ROLE_ADMIN, ROLE_NGO] }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/face-login, roles: PUBLIC_ACCESS }
        - { path: ^/face-enroll/save, roles: PUBLIC_ACCESS }
        - { path: ^/face-enroll, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/geocode, roles: PUBLIC_ACCESS }
